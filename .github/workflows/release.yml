# Релизный пайплайн (план docs/plans/2026-09-20-release-pipeline-plan.md,
# порядок работ №1 владельца; hardening-роадмап §11, H5).
# Ручной запуск: Actions → release → Run workflow.
# Версия — <Version> в src/SnowMeltingCalculator.csproj (единственный
# источник); вход version необязателен: пусто = взять из csproj,
# задан = обязан совпадать с csproj. Сетап-имя и папку выдачи берёт
# installer/*.iss сам.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Пусто = взять <Version> из src/SnowMeltingCalculator.csproj; если задана — обязана совпадать с csproj (например 1.8.0)'
        required: false
        type: string
        default: ''
      push_tag:
        description: 'Пушить тег vX.Y.Z (сними галочку, чтобы только собрать сетап)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write   # пуш аннотированного тега vX.Y.Z

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      HAS_RCLONE_CONF: ${{ secrets.RCLONE_CONF_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: "Гейт: релиз только с master"
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Релиз запускается только с master (запущен на ${GITHUB_REF})."
            exit 1
          fi

      - name: "Гейт: версия релиза (вход или csproj, формат X.Y.Z)"
        shell: bash
        run: |
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SnowMeltingCalculator.csproj)
          if [ -z "${CSPROJ_VERSION}" ]; then
            echo "::error::Не удалось прочитать <Version> из src/SnowMeltingCalculator.csproj."
            exit 1
          fi
          if [ -z "${VERSION}" ]; then
            echo "Вход не задан — версия берётся из csproj: ${CSPROJ_VERSION}."
          else
            echo "Вход: ${VERSION}; csproj: <Version>${CSPROJ_VERSION}</Version>."
            if [ "${VERSION}" != "${CSPROJ_VERSION}" ]; then
              echo "::error::Вход ${VERSION} не совпадает с <Version>${CSPROJ_VERSION}</Version> в src/SnowMeltingCalculator.csproj — подними версию scripts/bump-version.ps1, закоммить и перезапусти."
              exit 1
            fi
          fi
          if ! [[ "${CSPROJ_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Версия '${CSPROJ_VERSION}' не в формате X.Y.Z (например 1.8.0)."
            exit 1
          fi
          echo "RELEASE_VERSION=${CSPROJ_VERSION}" >> "${GITHUB_ENV}"

      - name: "Гейт: тег v${RELEASE_VERSION} свободен"
        if: ${{ inputs.push_tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::Тег v${RELEASE_VERSION} уже существует в origin."
            exit 1
          fi

      - name: Restore
        run: dotnet restore SnowMeltingCalculator.sln

      - name: Build (Release)
        run: dotnet build SnowMeltingCalculator.sln -c Release --no-restore

      - name: Full suite (without UiSmoke)
        run: dotnet test SnowMeltingCalculator.sln -c Release --no-build --nologo
             --filter "Category!=UiSmoke"

      - name: Publish (self-contained win-x64, параметры дублируют csproj)
        run: dotnet publish src/SnowMeltingCalculator.csproj -c Release
             -r win-x64 --self-contained true -o publish

      - name: Inno Setup (страховка, на образе уже предустановлен)
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }

      - name: Compile installer (ISCC)
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\SnowMeltingCalculator.iss"'

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnowMeltingCalculator-v${{ env.RELEASE_VERSION }}-Setup
          path: output/*.exe
          if-no-files-found: error

      # Автозаливка сетапа в папку выдачи на Google Drive (rclone, OAuth
      # владельца через секрет RCLONE_CONF_B64 — base64 локального
      # rclone.conf с remote gdrive; см. scripts/upload-to-drive.ps1).
      # Шаг пропускается, пока секрет не создан.
      - name: Upload setup to Google Drive
        if: ${{ env.HAS_RCLONE_CONF == 'true' }}
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        shell: pwsh
        run: |
          choco install rclone -y --no-progress
          $confDir = Join-Path $env:RUNNER_TEMP 'rclone-conf'
          New-Item -ItemType Directory -Force $confDir | Out-Null
          $conf = Join-Path $confDir 'rclone.conf'
          [IO.File]::WriteAllBytes($conf, [Convert]::FromBase64String($env:RCLONE_CONF_B64))
          $exe = "output\SnowMeltingCalculator-v${{ env.RELEASE_VERSION }}-Setup.exe"
          # Папка выдачи адресуется по имени: синтаксис {ID} в rclone v1.75
          # молча создаёт папку с литеральным именем в скобках (проверено
          # 2026-09-20). При переименовании папки — поправить здесь и в
          # scripts/upload-to-drive.ps1.
          rclone copy --config $conf $exe "gdrive:ACE 08.09.2026" -v
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Манифест обновлений latest.json (план 1.3 роадмапа post-1.8):
      # тот же скрипт, что и локальный пуск владельца (один алгоритм —
      # чек R-2026-09-21-02 №8); скрипт сам гейтит смену FILE_ID.
      # U9 (дефолт): сбой публикации = warning, релиз не гейтится.
      - name: Publish update manifest (latest.json)
        if: ${{ env.HAS_RCLONE_CONF == 'true' }}
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          FOLDER_URL: ${{ vars.RELEASE_FOLDER_URL }}
        shell: pwsh
        run: |
          choco install rclone -y --no-progress
          $confDir = Join-Path $env:RUNNER_TEMP 'rclone-conf'
          New-Item -ItemType Directory -Force $confDir | Out-Null
          $conf = Join-Path $confDir 'rclone.conf'
          [IO.File]::WriteAllBytes($conf, [Convert]::FromBase64String($env:RCLONE_CONF_B64))
          scripts/publish-latest-manifest.ps1 -RcloneConf $conf -FolderUrl "$env:FOLDER_URL"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Манифест latest.json не опубликован — «Проверить обновления» будет честно сообщать «не удалось проверить». Сетап и тег не пострадали (U9)."
          }

      # Напоминания U8 (чек R-2026-09-21-02 №4/№9): пустая константа ссылки
      # манифеста и отсутствие записи WhatsNewCatalog для релизной версии.
      - name: "Напоминания канала обновлений (U8)"
        shell: bash
        run: |
          URL=$(grep -o 'ManifestUrl = "[^"]*"' src/Services/Updates/UpdateChannelOptions.cs | head -1)
          if [ "${URL}" = 'ManifestUrl = ""' ]; then
            echo "::warning::UpdateChannelOptions.ManifestUrl пуст — «Проверить обновления» сообщит «канал не настроен». Запусти scripts/publish-latest-manifest.ps1 локально, впиши ссылку в константу и выпусти следующую версию."
          fi
          VERSION="${RELEASE_VERSION}"
          if ! grep -q "\"${VERSION}\"" src/Services/Updates/WhatsNewCatalog.cs; then
            echo "::warning::В WhatsNewCatalog нет записи для ${VERSION} — диалог «Что нового» при старте для этой версии показываться не будет. Добавь запись в release-коммите."
          fi

      - name: Push tag v${RELEASE_VERSION}
        if: ${{ inputs.push_tag }}
        shell: bash
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION} (${GITHUB_SHA})"
          git push origin "v${RELEASE_VERSION}"
