# CI-гейт фазы A (план docs/plans/2026-09-12-process-gates-plan.md, решения 1–4).
# Полный набор без UiSmoke: смоук поднимает реальные окна и остаётся
# обязательным локальным шагом handover (решение 12/14 — флейк-политика).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  actions: write   # автопилот: workflow_dispatch release.yml от GITHUB_TOKEN

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SnowMeltingCalculator.sln

      - name: Build (Release)
        run: dotnet build SnowMeltingCalculator.sln -c Release --no-restore

      - name: Architecture rules (fast feedback)
        run: dotnet test SnowMeltingCalculator.sln -c Release --no-build --nologo
             --filter "FullyQualifiedName~Architecture"

      - name: Full suite (without UiSmoke)
        run: dotnet test SnowMeltingCalculator.sln -c Release --no-build --nologo
             --filter "Category!=UiSmoke"

  # Автопилот релиза (решение владельца 2026-09-20, «бампнул версию → всё
  # само»): после зелёного CI на пуш в master сравнить <Version> в csproj
  # с тегами origin. Тега vVERSION нет → запустить release.yml (сборка,
  # инсталлятор, Drive, тег). Тег есть → версия уже выпущена, шаг молча
  # пропускается. Ручной запуск release.yml остаётся возможен.
  auto-release:
    needs: test
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Автопилот: тега v<Version> нет → запустить release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SnowMeltingCalculator.csproj)
          if [ -z "${VERSION}" ]; then
            echo "::error::Не удалось прочитать <Version> из src/SnowMeltingCalculator.csproj."
            exit 1
          fi
          echo "Версия csproj: ${VERSION}."
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Тег v${VERSION} уже в origin — версия выпущена, автопилот пропускает."
            exit 0
          fi
          echo "Тега v${VERSION} нет — запускаю release (workflow_dispatch, push_tag=true)."
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref master \
            -f version="${VERSION}" -f push_tag=true
